services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - shared-data:/data
      - ${EXPORT_PATH:-./exports}:/data/exports
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - NEO4J_MODE=${NEO4J_MODE:-external}
      - NEO4J_URI=${NEO4J_URI:-bolt://host.docker.internal:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: []
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3080:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    profiles:
      - neo4j-internal
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme123}
      - NEO4J_PLUGINS=["apoc"]
    restart: unless-stopped

volumes:
  shared-data:
  neo4j-data:
  neo4j-logs:
