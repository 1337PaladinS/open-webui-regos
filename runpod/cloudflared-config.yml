# Cloudflare Tunnel configuration for APAS AI RunPod pods.
#
# This is a TEMPLATE. At runtime, start.sh generates the final config
# from environment variables:
#   CLOUDFLARED_TUNNEL_ID   – UUID from `cloudflared tunnel create`
#   CLOUDFLARED_CREDS_FILE  – path to the credentials JSON (usually /workspace/cloudflared/<uuid>.json)
#   CLOUDFLARED_HOSTNAME    – primary hostname, e.g. regos.apas.ai
#
# Additional subdomains (ingestion.apas.ai, billing.apas.ai, etc.)
# can be added to the ingress list as the platform grows.
#
# Docs: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/

tunnel: TUNNEL_ID_PLACEHOLDER
credentials-file: CREDS_FILE_PLACEHOLDER

# Disable TLS verification for localhost origins (they're plain HTTP)
originRequest:
  noTLSVerify: true

ingress:
  # Primary RegOS interface (Open WebUI)
  - hostname: HOSTNAME_PLACEHOLDER
    service: http://localhost:8080
    originRequest:
      # Prevent Cloudflare from buffering streamed responses (SSE/LLM tokens)
      disableChunkedEncoding: true

  # RegOS Sidecar API v2
  - hostname: regos-api.apas.ai
    service: http://localhost:8300
    originRequest:
      disableChunkedEncoding: true

  # Catch-all rule (required by cloudflared)
  - service: http_status:404
