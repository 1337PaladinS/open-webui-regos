# install.conf — RegOS Installer Configuration
# Override these via environment variables or CLI flags

# Docker container name running Open WebUI
CONTAINER_NAME="open-webui"

# Open WebUI API base URL — set to your host (e.g. https://eqcb.apas.ai)
OPENWEBUI_URL="${OPENWEBUI_URL:-http://localhost:3000}"

# Where data files are stored inside the container
CONTAINER_DATA_DIR="/app/backend/data"

# Where demo/utility scripts are copied inside the container
CONTAINER_SCRIPTS_DIR="/tmp"

# Create the "RegOS Compliance Copilot" custom model on install
CREATE_MODEL=true

# Base model for the custom model (via OpenRouter)
BASE_MODEL="openrouter/google/gemini-2.0-flash-001"

# Custom model display name
MODEL_NAME="RegOS Compliance Copilot"
MODEL_ID="regos-compliance-copilot"

# Create user groups on install
SETUP_GROUPS=false
GROUP_NAME="RegOS Testers"
GROUP_MEMBERS=""

# Retry settings for API calls
MAX_RETRIES=3
RETRY_DELAY=2

# Debug output
VERBOSE=false
